# Nginx Reverse Proxy cho Grafana Monitoring (http://monitor.lab.local)
# Vị trí trên Server: /etc/nginx/sites-available/monitor.lab.local.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name monitor.lab.local;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
    }
}
