# Cấu hình Virtual Host / Server Block cho Nginx
# Vị trí trên Server: /etc/nginx/sites-available/web.lab.local.conf

server {
    listen 80;
    listen [::]:80;

    server_name web.lab.local;

    root /var/www/lab.local/html;
    index index.html index.htm;

    access_log /var/log/nginx/web.lab.local_access.log;
    error_log /var/log/nginx/web.lab.local_error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
