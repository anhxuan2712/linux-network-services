# Cấu hình IP tĩnh cho Ubuntu Server 24.04 LTS (2 card mạng: NAT + Host-Only)
# Vị trí trên Server: /etc/netplan/01-netcfg.yaml
network:
  version: 2
  ethernets:
    enp2s0: # Card Share with my Mac (NAT) - giữ DHCP để có Internet cài gói apt
      dhcp4: true
    enp10s0: # Card Private to my Mac (Host-Only) - IP tĩnh nội bộ
      dhcp4: false
      addresses:
        - 192.168.10.10/24
