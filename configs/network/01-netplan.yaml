# Cấu hình IP tĩnh cho Ubuntu Server 24.04 LTS
# Vị trí trên Server: /etc/netplan/01-netcfg.yaml hoặc 50-cloud-init.yaml
network:
  version: 2
  renderer: networkd
  ethernets:
    ens33: # Đổi thành tên card mạng thực tế (vd: ens33, enp0s3)
      dhcp4: no
      addresses:
        - 192.168.10.10/24
      routes:
        - to: default
          via: 192.168.10.1
      nameservers:
        addresses:
          - 192.168.10.10
          - 8.8.8.8
        search:
          - lab.local
